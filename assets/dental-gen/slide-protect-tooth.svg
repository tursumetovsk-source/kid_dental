<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="toothShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-3" dy="5" stdDeviation="0" flood-color="#2f2076" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Floating Soap Bubbles -->
  <g fill="#dff4ff" stroke="#2f2076" stroke-width="2" opacity="0.9">
    <circle cx="45" cy="65" r="14" />
    <circle cx="41" cy="61" r="4" fill="#ffffff" stroke="none" />
    <circle cx="230" cy="55" r="18" />
    <circle cx="225" cy="50" r="5" fill="#ffffff" stroke="none" />
    <circle cx="240" cy="180" r="12" />
  </g>

  <!-- Superhero Cape Behind Tooth -->
  <path d="M 90 95 C 40 130, 30 210, 60 230 C 85 220, 100 170, 100 140 Z" fill="#ff708d" stroke="#2f2076" stroke-width="3.5" />
  <path d="M 190 95 C 240 130, 250 210, 220 230 C 195 220, 180 170, 180 140 Z" fill="#ff708d" stroke="#2f2076" stroke-width="3.5" />

  <!-- Tooth Body with Thick Outline and Drop Shadow -->
  <g filter="url(#toothShadow2)">
    <path d="M 80 80 
             C 80 45, 120 40, 140 55 
             C 160 40, 200 45, 200 80 
             C 205 125, 200 160, 185 200 
             C 175 225, 155 225, 148 185 
             C 145 170, 135 170, 132 185 
             C 125 225, 105 225, 95 200 
             C 80 160, 75 125, 80 80 Z" 
          fill="#ffffff" stroke="#2f2076" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Pink Blush Cheeks -->
  <ellipse cx="102" cy="132" rx="12" ry="7" fill="#ffb8d2" opacity="0.9" />
  <ellipse cx="178" cy="132" rx="12" ry="7" fill="#ffb8d2" opacity="0.9" />

  <!-- Big Happy Eyes (Winking / Confident Superhero) -->
  <ellipse cx="112" cy="115" rx="7" ry="10" fill="#2f2076" />
  <circle cx="110" cy="111" r="3.2" fill="#ffffff" />
  <circle cx="114" cy="118" r="1.4" fill="#ffffff" />

  <path d="M 160 115 Q 170 106 180 115" fill="none" stroke="#2f2076" stroke-width="4" stroke-linecap="round" />

  <!-- Proud Smile with Cute Tongue -->
  <path d="M 126 128 Q 140 148 154 128 Z" fill="#ff708d" stroke="#2f2076" stroke-width="3.5" />

  <!-- Protection Shield Emblem / Accessory -->
  <g transform="translate(170, 140) rotate(10)" filter="url(#toothShadow2)">
    <path d="M 25 5 L 45 15 C 45 42, 25 58, 25 58 C 25 58, 5 42, 5 15 Z" fill="#ffe59a" stroke="#2f2076" stroke-width="3" />
    <path d="M 25 20 Q 25 28 20 32 Q 25 36 25 42 Q 25 36 30 32 Q 25 28 25 20 Z" fill="#ff708d" />
  </g>
</svg>
